spring:
  application:
    name: smarttrip-api

  datasource:
    url: jdbc:postgresql://localhost:5432/smarttrip
    username: smarttrip
    password: smarttrip

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:4b-instruct
        think: false
        num-predict: 600
        temperature: 0.7
        keep-alive: 5m

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

geoapify:
  api-key: ${GEOAPIFY_API_KEY}
