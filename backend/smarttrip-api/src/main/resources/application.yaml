spring:
  application:
    name: smarttrip-api

  datasource:
    url: jdbc:postgresql://localhost:5432/smarttrip
    username: smarttrip
    password: smarttrip

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    chat:
      client:
        enabled: false

    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:4b-instruct
        think: false
        num-predict: 600
        temperature: 0.7
        keep-alive: 5m

    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          model: gemini-3.5-flash
          temperature: 0.7

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  cache:
    type: caffeine
    cache-names:
      - foursquarePlaces
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h

foursquare:
  api-key: ${FOURSQUARE_API_KEY}
