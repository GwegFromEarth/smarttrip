<h1>✈️ SmartTrip</h1>

<p>Votre assistant de voyage IA</p>

<hr>

<div class="input-area">

  <textarea
    placeholder="Posez votre question..."
    [value]="message()"
    (input)="message.set($any($event.target).value)"
    (keydown.enter)="onEnter($event)"
  ></textarea>

  <button
    type="button"
    (click)="sendStreamMessage()"
    [disabled]="!message().trim() || isStreaming()"
  >
    @if (isStreaming()) {
      Envoi en cours...
    } @else {
      Envoyer
    }
  </button>

</div>

<hr>

<div class="conversation" #conversation>

  @for (message of messages(); track $index) {

    <div
      class="message"
      [class.user-message]="message.role === 'user'"
      [class.assistant-message]="message.role === 'assistant'"
    >

      <div class="message-author">

        @if (message.role === 'user') {
          Vous
        } @else {
          SmartTrip
        }

      </div>

      <div class="message-content">

        @if (message.streaming) {

          <!--
            Pendant le streaming :
            affichage texte brut.
            ngx-markdown n'analyse donc pas
            le Markdown incomplet.
          -->
          <div class="streaming-content">
            {{ message.content }}
          </div>

        } @else {

          <!--
            Une fois le streaming terminé :
            rendu Markdown complet.
          -->
          <markdown [data]="message.content"></markdown>

        }

      </div>

    </div>

  }

</div>
